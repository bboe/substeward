name: CI

on:
  push:
    branches: [main]
  pull_request:

# redis-memory-server (a transitive dep of @devvit/test) compiles Redis from
# source in its postinstall hook and fails the install on current runner images.
# Skip it; the test job supplies the distro binary instead.
env:
  REDISMS_DISABLE_POSTINSTALL: '1'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install --upgrade pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    # The harness (@devvit/test) boots a real Redis, so it needs a binary.
    env:
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm test
